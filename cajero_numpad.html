<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Cajero P2P - Bingo Kaleido</title>

    <!-- Telegram WebApp SDK Oficial -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-principal: #0b0f19;
            --tarjeta-bg: #131a2a;
            --tecla-bg: #182236;
            --tecla-hover: #22304c;
            --oro-primario: #ffc857;
            --oro-gradiente: linear-gradient(135deg, #ffc857 0%, #e5a93c 100%);
            --azul-boton: #2563eb;
            --azul-gradiente: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --texto-apagado: #94a3b8;
            --borde-suave: rgba(255, 255, 255, 0.08);
            --borde-activo: rgba(255, 200, 87, 0.45);
            --rojo-borrar: #ef4444;
            --altura-pantalla: var(--tg-viewport-stable-height, 100vh);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            background-color: var(--bg-principal);
            color: #ffffff;
            height: var(--altura-pantalla);
            min-height: var(--altura-pantalla);
            width: 100%;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 12px 16px 14px 16px;
        }

        /* 1. Encabezado de la Operación y Tasa Oficial */
        .header-cajero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(19, 26, 42, 0.9) 0%, rgba(13, 18, 30, 0.9) 100%);
            border: 1px solid var(--borde-suave);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 10px;
        }

        .header-titulo {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-tasa {
            background: rgba(255, 200, 87, 0.12);
            border: 1px solid rgba(255, 200, 87, 0.35);
            color: var(--oro-primario);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        /* 2. Switch Segmentado Bimonetario (USKT vs. Bs) */
        .switch-moneda-container {
            display: flex;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--borde-suave);
            border-radius: 10px;
            padding: 3px;
            gap: 4px;
            margin-bottom: 10px;
        }

        .btn-switch {
            flex: 1;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--texto-apagado);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-switch.activo {
            background: rgba(255, 200, 87, 0.16);
            color: var(--oro-primario);
            border-color: var(--borde-activo);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        /* 3. Visor Jerárquico de Cantidades */
        .visor-monto {
            background: var(--tarjeta-bg);
            border: 1px solid var(--borde-suave);
            border-radius: 14px;
            padding: 10px 14px;
            text-align: center;
            margin-bottom: 10px;
        }

        .visor-etiqueta {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--texto-apagado);
            margin-bottom: 3px;
        }

        .visor-cifra-principal {
            font-size: 30px;
            font-weight: 800;
            color: var(--oro-primario);
            line-height: 1.15;
            letter-spacing: 0.5px;
            word-break: break-all;
        }

        .visor-cifra-secundaria {
            font-size: 12px;
            font-weight: 600;
            color: var(--texto-apagado);
            margin-top: 3px;
        }

        /* 4. Atajos Pedagógicos de Selección Rápida con Decimales */
        .atajos-contenedor {
            margin-bottom: 10px;
        }

        .atajos-etiqueta {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--texto-apagado);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .atajos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn-atajo {
            background: var(--tecla-bg);
            border: 1px solid var(--borde-suave);
            border-radius: 8px;
            padding: 7px 2px;
            color: #f1f5f9;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-atajo:active {
            transform: scale(0.95);
            border-color: var(--oro-primario);
            background: rgba(255, 200, 87, 0.14);
        }

        /* 5. Numpad Táctil Compacto y Ergonómico (48px de altura) */
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            margin-bottom: 10px;
        }

        .tecla {
            height: 48px;
            background: var(--tecla-bg);
            border: 1px solid var(--borde-suave);
            border-radius: 10px;
            color: #ffffff;
            font-size: 21px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s ease, transform 0.1s ease;
        }

        .tecla:active {
            background: var(--tecla-hover);
            transform: scale(0.96);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .tecla.tecla-doble-cero {
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .tecla.tecla-borrar {
            color: var(--rojo-borrar);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icono-borrar {
            width: 22px;
            height: 22px;
            stroke-width: 2.2;
        }

        /* 6. Botón Nuclear de Confirmación */
        .btn-confirmar {
            height: 48px;
            width: 100%;
            background: var(--azul-gradiente);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn-confirmar:active {
            transform: scale(0.98);
        }

        .btn-confirmar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Encabezado con Operación Dinámica y Tasa -->
    <header class="header-cajero">
        <div class="header-titulo" id="encabezadoTitulo">
            <span>🏦</span>
            <span id="textoOperacion">CAJERO P2P • RECARGA</span>
        </div>
        <div class="badge-tasa" id="badgeTasaReferencial">
            1 USKT = Bs. 946.30
        </div>
    </header>

    <!-- Barra de Alternancia Bimonetaria -->
    <section class="switch-moneda-container">
        <button type="button" class="btn-switch activo" id="btnModoUSKT" onclick="cambiarModoMoneda('USKT')">
            <span>🟡</span>
            <span>USKT</span>
        </button>
        <button type="button" class="btn-switch" id="btnModoBS" onclick="cambiarModoMoneda('BS')">
            <span>🇻🇪</span>
            <span>Bolívares (Bs)</span>
        </button>
    </section>

    <!-- Pantalla Visor de Cifras -->
    <section class="visor-monto">
        <div class="visor-etiqueta" id="etiquetaVisor">CANTIDAD A RECARGAR</div>
        <div class="visor-cifra-principal" id="cifraPrincipal">0.00 USKT</div>
        <div class="visor-cifra-secundaria" id="cifraSecundaria">≈ Bs. 0.00</div>
    </section>

    <!-- Bloque Pedagógico de Atajos Rápidos con Decimales -->
    <section class="atajos-contenedor">
        <div class="atajos-etiqueta">
            <span>⚡</span>
            <span>MONTOS RÁPIDOS SUGERIDOS</span>
        </div>
        <div class="atajos-grid">
            <button type="button" class="btn-atajo" onclick="agregarAtajoRapido(4.99)">+4.99 USKT</button>
            <button type="button" class="btn-atajo" onclick="agregarAtajoRapido(9.99)">+9.99 USKT</button>
            <button type="button" class="btn-atajo" onclick="agregarAtajoRapido(14.99)">+14.99 USKT</button>
            <button type="button" class="btn-atajo" onclick="agregarAtajoRapido(19.99)">+19.99 USKT</button>
        </div>
    </section>

    <!-- Numpad Táctil Ergonómico (48px de altura por tecla) -->
    <section class="numpad-grid">
        <button type="button" class="tecla" onclick="presionarDigito('1')">1</button>
        <button type="button" class="tecla" onclick="presionarDigito('2')">2</button>
        <button type="button" class="tecla" onclick="presionarDigito('3')">3</button>

        <button type="button" class="tecla" onclick="presionarDigito('4')">4</button>
        <button type="button" class="tecla" onclick="presionarDigito('5')">5</button>
        <button type="button" class="tecla" onclick="presionarDigito('6')">6</button>

        <button type="button" class="tecla" onclick="presionarDigito('7')">7</button>
        <button type="button" class="tecla" onclick="presionarDigito('8')">8</button>
        <button type="button" class="tecla" onclick="presionarDigito('9')">9</button>

        <button type="button" class="tecla tecla-doble-cero" onclick="presionarDobleCero()">00</button>
        <button type="button" class="tecla" onclick="presionarDigito('0')">0</button>
        <button type="button" class="tecla tecla-borrar" onclick="presionarBorrar()" style="font-size: 26px; line-height: 1;">⌫</button>
    </section>

    <!-- Botón de Confirmación y Despacho -->
    <footer>
        <button type="button" class="btn-confirmar" id="btnConfirmarOperacion" onclick="procesarConfirmacion()">
            <span>✅</span>
            <span id="textoBotonConfirmar">CONFIRMAR MONTO</span>
        </button>
    </footer>
</div> <!-- Fin de app-container -->
    <script>
    // =========================================================
    // 1. INICIALIZACIÓN DE TELEGRAM WEBAPP Y VARIABLES GLOBALES
    // =========================================================
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
        tg.ready();
        tg.expand();
        tg.enableClosingConfirmation();
    }

    // Parámetros dinámicos desde la URL
    const urlParams = new URLSearchParams(window.location.search);
    const tipoOperacion = (urlParams.get('tipo') || urlParams.get('modo') || 'recarga').toLowerCase();
    const tasaParam = parseFloat(urlParams.get('tasa')) || 946.30;
    const apiUrlParam = urlParams.get('api_url') || '';

    // Estado interno del cajero
    let TASA_CAMBIO = tasaParam;
    let modoMoneda = 'USKT'; // 'USKT' o 'BS'
    let bufferCéntimos = "0"; // Almacena los dígitos en céntimos (modo cajero ATM)

    // Referencias a elementos del DOM
    const textoOperacion = document.getElementById('textoOperacion');
    const badgeTasaReferencial = document.getElementById('badgeTasaReferencial');
    const etiquetaVisor = document.getElementById('etiquetaVisor');
    const cifraPrincipal = document.getElementById('cifraPrincipal');
    const cifraSecundaria = document.getElementById('cifraSecundaria');
    const btnModoUSKT = document.getElementById('btnModoUSKT');
    const btnModoBS = document.getElementById('btnModoBS');
    const btnConfirmarOperacion = document.getElementById('btnConfirmarOperacion');
    const textoBotonConfirmar = document.getElementById('textoBotonConfirmar');

    // =========================================================
    // 2. CONFIGURACIÓN INICIAL SEGÚN EL TIPO DE OPERACIÓN
    // =========================================================
    function inicializarInterfaz() {
        badgeTasaReferencial.textContent = `1 USKT = Bs. ${TASA_CAMBIO.toFixed(2)}`;

        if (tipoOperacion === 'retiro') {
            textoOperacion.textContent = 'CAJERO P2P • RETIRO';
            etiquetaVisor.textContent = 'CANTIDAD A RETIRAR';
            textoBotonConfirmar.textContent = 'CONFIRMAR RETIRO';
        } else {
            textoOperacion.textContent = 'CAJERO P2P • RECARGA';
            etiquetaVisor.textContent = 'CANTIDAD A RECARGAR';
            textoBotonConfirmar.textContent = 'CONFIRMAR MONTO';
        }

        actualizarVisualizador();
    }

    // =========================================================
    // 3. VIBRACIÓN HÁPTICA AUXILIAR
    // =========================================================
    function ejecutarHaptico(tipo = 'light') {
        if (tg && tg.HapticFeedback) {
            if (tipo === 'light' || tipo === 'medium' || tipo === 'heavy') {
                tg.HapticFeedback.impactOccurred(tipo);
            } else if (tipo === 'error' || tipo === 'success' || tipo === 'warning') {
                tg.HapticFeedback.notificationOccurred(tipo);
            }
        }
    }

    // =========================================================
    // 4. CÁLCULO Y RENDERIZADO DEL VISOR JERÁRQUICO
    // =========================================================
    function obtenerValorNumerico() {
        const centimos = parseInt(bufferCéntimos, 10) || 0;
        return centimos / 100;
    }

    function fijarValorNumerico(valor) {
        const centimos = Math.round(Math.max(0, valor) * 100);
        bufferCéntimos = centimos.toString();
    }

    function actualizarVisualizador() {
        const valorActual = obtenerValorNumerico();

        if (modoMoneda === 'USKT') {
            const montoUSKT = valorActual;
            const montoBS = montoUSKT * TASA_CAMBIO;

            cifraPrincipal.textContent = `${montoUSKT.toFixed(2)} USKT`;
            cifraSecundaria.textContent = `≈ Bs. ${montoBS.toFixed(2)}`;
        } else {
            const montoBS = valorActual;
            const montoUSKT = TASA_CAMBIO > 0 ? (montoBS / TASA_CAMBIO) : 0;

            cifraPrincipal.textContent = `Bs. ${montoBS.toFixed(2)}`;
            cifraSecundaria.textContent = `≈ ${montoUSKT.toFixed(2)} USKT`;
        }

        // Habilitar o deshabilitar botón de confirmación si el monto es mayor a 0
        if (valorActual > 0) {
            btnConfirmarOperacion.disabled = false;
        } else {
            btnConfirmarOperacion.disabled = true;
        }
    }

    // =========================================================
    // 5. SELECTOR DE DIVISA (SWITCH USKT / BS)
    // =========================================================
    function cambiarModoMoneda(nuevoModo) {
        if (modoMoneda === nuevoModo) {
            return;
        }

        ejecutarHaptico('medium');

        const valorActual = obtenerValorNumerico();

        if (nuevoModo === 'BS') {
            // Conversión al cambiar de USKT a BS: Convertimos la cantidad actual al equivalente en Bs
            const equivalenteBs = valorActual * TASA_CAMBIO;
            fijarValorNumerico(equivalenteBs);

            modoMoneda = 'BS';
            btnModoUSKT.classList.remove('activo');
            btnModoBS.classList.add('activo');
        } else {
            // Conversión al cambiar de BS a USKT: Convertimos la cantidad actual al equivalente en USKT
            const equivalenteUSKT = TASA_CAMBIO > 0 ? (valorActual / TASA_CAMBIO) : 0;
            fijarValorNumerico(equivalenteUSKT);

            modoMoneda = 'USKT';
            btnModoBS.classList.remove('activo');
            btnModoUSKT.classList.add('activo');
        }

        actualizarVisualizador();
    }

    // =========================================================
    // 6. CONTROL DEL TECLADO NUMÉRICO (NUMPAD ATM)
    // =========================================================
    function presionarDigito(digito) {
        ejecutarHaptico('light');

        if (bufferCéntimos.length >= 10) {
            ejecutarHaptico('warning');
            return;
        }

        if (bufferCéntimos === "0") {
            bufferCéntimos = digito;
        } else {
            bufferCéntimos += digito;
        }

        actualizarVisualizador();
    }

    function presionarDobleCero() {
        ejecutarHaptico('light');

        if (bufferCéntimos === "0") {
            return;
        }

        if (bufferCéntimos.length <= 8) {
            bufferCéntimos += "00";
        } else {
            ejecutarHaptico('warning');
        }

        actualizarVisualizador();
    }

    function presionarBorrar() {
        ejecutarHaptico('medium');

        if (bufferCéntimos.length <= 1) {
            bufferCéntimos = "0";
        } else {
            bufferCéntimos = bufferCéntimos.slice(0, -1);
        }

        actualizarVisualizador();
    }

    // =========================================================
    // 7. BOTONES PEDAGÓGICOS DE SELECCIÓN RÁPIDA CON DECIMALES
    // =========================================================
    function agregarAtajoRapido(montoUSKT) {
        ejecutarHaptico('light');

        const valorActual = obtenerValorNumerico();

        if (modoMoneda === 'USKT') {
            // Si el usuario introduce datos en USKT, sumamos directamente la cantidad en USKT
            const nuevoTotalUSKT = valorActual + montoUSKT;
            fijarValorNumerico(nuevoTotalUSKT);
        } else {
            // Si el usuario introduce datos en Bs, sumamos el equivalente en Bolívares
            const equivalenteEnBs = montoUSKT * TASA_CAMBIO;
            const nuevoTotalBS = valorActual + equivalenteEnBs;
            fijarValorNumerico(nuevoTotalBS);
        }

        actualizarVisualizador();
    }

    // =========================================================
    // 8. DESPACHO Y CONFIRMACIÓN TRANSACCIONAL
    // =========================================================
    async function procesarConfirmacion() {
        const valorActual = obtenerValorNumerico();

        if (valorActual <= 0) {
            ejecutarHaptico('error');
            return;
        }

        ejecutarHaptico('success');
        btnConfirmarOperacion.disabled = true;
        textoBotonConfirmar.textContent = 'PROCESANDO...';

        // Determinar montos normalizados
        let montoFinalUSKT = 0;
        let montoFinalBS = 0;

        if (modoMoneda === 'USKT') {
            montoFinalUSKT = valorActual;
            montoFinalBS = valorActual * TASA_CAMBIO;
        } else {
            montoFinalBS = valorActual;
            montoFinalUSKT = TASA_CAMBIO > 0 ? (valorActual / TASA_CAMBIO) : 0;
        }

        const idempotencyKey = (typeof crypto !== 'undefined' && crypto.randomUUID)
            ? crypto.randomUUID()
            : (`p2p_${Date.now()}_${Math.floor(Math.random() * 1000000)}`);

        const payload = {
            accion: tipoOperacion === 'retiro' ? 'cajero_retiro' : 'cajero_recarga',
            tipo_operacion: tipoOperacion,
            moneda_origen: modoMoneda,
            monto_uskt: parseFloat(montoFinalUSKT.toFixed(2)),
            monto_bs: parseFloat(montoFinalBS.toFixed(2)),
            tasa: parseFloat(TASA_CAMBIO.toFixed(2)),
            idempotency_key: idempotencyKey
        };

        // 1. Envío mediante fetch al backend de Vercel si existe apiUrl
        if (apiUrlParam) {
            try {
                await fetch(`${apiUrlParam.replace(/\/$/, '')}/api/cajero-submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': (tg && tg.initData) ? tg.initData : ''
                    },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.warn("Fallo en despacho por API, respaldando con Telegram:", error);
            }
        }

        // 2. Envío nativo vía Telegram WebApp (si está habilitado el canal de datos)
        try {
            if (tg && typeof tg.sendData === 'function') {
                tg.sendData(JSON.stringify(payload));
            }
        } catch (error) {
            console.warn("sendData omitido o no soportado en este contexto:", error);
        }

        // Cerrar la Mini App para regresar al chat con la confirmación
        if (tg) {
            setTimeout(() => {
                tg.close();
            }, 180);
        }
    }

    // Disparar configuración al cargar el DOM
    window.addEventListener('DOMContentLoaded', inicializarInterfaz);
</script>
</body>
</html>
