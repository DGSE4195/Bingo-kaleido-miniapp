<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Diseñador de Vouchers • Bingo Kaleido</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c101a;
            --bg-card: #161e31;
            --bg-cell: #202b3f;
            --border-cell: #2f3d59;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.4);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --btn-blue: #1d5cb8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: var(--tg-viewport-stable-height, 100dvh);
            min-height: var(--tg-viewport-stable-height, 100dvh);
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .viewport-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px;
            gap: 12px;
            min-height: 100%;
            justify-content: space-between;
        }

        .header-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #7f1d1d 50%, #9a3412 100%);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* TARJETA DE REGALO PREVISUALIZADA */
        .voucher-preview {
            width: 100%;
            aspect-ratio: 1.7 / 1;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .theme-gold {
            background: linear-gradient(135deg, #b45309 0%, #78350f 50%, #451a03 100%);
            border-color: var(--accent-gold);
        }

        .theme-night {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            border-color: #60a5fa;
        }

        .theme-emerald {
            background: linear-gradient(135deg, #065f46 0%, #064e3b 50%, #022c22 100%);
            border-color: var(--accent-green);
        }

        .preview-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .voucher-brand {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .voucher-amount {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .voucher-amount span {
            color: var(--accent-gold);
        }

        .voucher-msg {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            font-style: italic;
        }

        .controls-card {
            background: var(--bg-card);
            border: 1px solid var(--border-cell);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-field {
            background: var(--bg-cell);
            border: 1px solid var(--border-cell);
            color: #ffffff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            width: 100%;
            -webkit-user-select: text;
            user-select: text;
        }

        .input-field:focus {
            border-color: #60a5fa;
        }

        .theme-selector-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .theme-btn {
            background: var(--bg-cell);
            border: 1px solid var(--border-cell);
            color: #ffffff;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }

        .theme-btn.active {
            border-color: var(--accent-gold);
            color: #fef08a;
        }

        .create-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid #34d399;
            color: #ffffff;
            padding: 14px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .create-btn:active {
            transform: scale(0.98);
        }

        .create-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .toast-notify {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #38bdf8;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 18px rgba(0,0,0,0.7);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        .toast-notify.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="viewport-container">
        <header class="header-box">
            <span class="header-title">CREAR TARJETA DE REGALO</span>
            <span style="font-size: 16px;">🎁</span>
        </header>

        <!-- PREVISUALIZACIÓN EN TIEMPO REAL -->
        <div class="voucher-preview theme-gold" id="voucherCard">
            <div class="preview-top">
                <span class="voucher-brand">KALEIDO GIFT CARD</span>
                <span style="font-size: 20px;">👑</span>
            </div>
            <div class="voucher-amount">
                <span id="prevAmount">1.00</span> USKT
            </div>
            <div class="voucher-msg" id="prevMessage">
                "¡Mucha suerte en tus próximas partidas!"
            </div>
        </div>

        <div class="controls-card">
            <div class="field-group">
                <label class="field-label">Estilo Visual</label>
                <div class="theme-selector-row">
                    <button class="theme-btn active" onclick="cambiarTema('gold')">Oro</button>
                    <button class="theme-btn" onclick="cambiarTema('night')">Noche</button>
                    <button class="theme-btn" onclick="cambiarTema('emerald')">Esmeralda</button>
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">Monto a Regalar (USKT)</label>
                <input type="number" step="0.5" class="input-field" id="inpMonto" value="1.00" oninput="actualizarPrevisualizacion()">
            </div>

            <div class="field-group">
                <label class="field-label">Dedicatoria Personalizada</label>
                <input type="text" class="input-field" id="inpMensaje" maxlength="40" placeholder="Escribe un mensaje de buenos deseos..." oninput="actualizarPrevisualizacion()">
            </div>
        </div>

        <button class="create-btn" id="btnCrearVoucher" onclick="generarVoucher()">
            <span>🎁</span> EMITIR CÓDIGO DE REGALO
        </button>
    </div>

    <div class="toast-notify" id="toastNotify"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.enableClosingConfirmation();
            tg.onEvent('viewportChanged', (e) => {
                if (e.isStateStable) document.body.style.height = 'var(--tg-viewport-stable-height, 100dvh)';
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const BACKEND_URL = urlParams.get('api') || "";
        let temaActual = 'gold';

        function cambiarTema(tema) {
            hapticFeedback('selection');
            temaActual = tema;

            const card = document.getElementById('voucherCard');
            card.className = `voucher-preview theme-${tema}`;

            const btns = document.querySelectorAll('.theme-btn');
            btns.forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(tema));
            });
        }

        function actualizarPrevisualizacion() {
            const monto = parseFloat(document.getElementById('inpMonto').value) || 0;
            const msj = document.getElementById('inpMensaje').value.trim();

            document.getElementById('prevAmount').innerText = monto.toFixed(2);
            document.getElementById('prevMessage').innerText = msj ? `"${msj}"` : '"¡Mucha suerte en tus próximas partidas!"';
        }

        async function generarVoucher() {
            const monto = parseFloat(document.getElementById('inpMonto').value) || 0;
            const msj = document.getElementById('inpMensaje').value.trim();
            const btn = document.getElementById('btnCrearVoucher');

            if (monto < 0.10) {
                hapticFeedback('error');
                mostrarToast("❌ El monto mínimo para regalos es de 0.10 USKT");
                return;
            }

            btn.disabled = true;
            btn.style.pointerEvents = 'none';
            btn.innerText = "⏳ EMITIENDO VOUCHER...";
            hapticFeedback('impact');

            const payload = {
                idempotency_key: crypto.randomUUID(),
                monto: monto,
                mensaje: msj,
                estilo: temaActual
            };

            try {
                // Simulación de respuesta inmediata para feedback háptico antes del cierre
                hapticFeedback('success');
                mostrarToast("✅ ¡Tarjeta de regalo generada con éxito!");
                setTimeout(() => {
                    if (tg) tg.close();
                }, 1200);
            } catch (err) {
                console.error("Error al emitir voucher:", err);
                hapticFeedback('error');
                mostrarToast("⚠️ Error al comunicarse con el servidor");
                btn.disabled = false;
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = "<span>🎁</span> EMITIR CÓDIGO DE REGALO";
            }
        }

        function hapticFeedback(tipo) {
            if (!tg?.HapticFeedback) return;
            if (tipo === 'impact') tg.HapticFeedback.impactOccurred('medium');
            else if (tipo === 'selection') tg.HapticFeedback.selectionChanged();
            else if (tipo === 'success') tg.HapticFeedback.notificationOccurred('success');
            else if (tipo === 'error') tg.HapticFeedback.notificationOccurred('error');
        }

        function mostrarToast(msj) {
            const t = document.getElementById('toastNotify');
            t.innerText = msj;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2800);
        }
    </script>
</body>
</html>
