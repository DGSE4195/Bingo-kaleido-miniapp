<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Registro de Cuenta • Bingo Kaleido</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0c101a;
            --bg-card: #161e31;
            --bg-cell: #202b3f;
            --border-cell: #2f3d59;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #b91c1c;
            --btn-blue: #1d5cb8;
            --btn-blue-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: var(--tg-viewport-stable-height, 100dvh);
            min-height: var(--tg-viewport-stable-height, 100dvh);
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .viewport-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px;
            gap: 12px;
        }

        .header-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #7f1d1d 50%, #9a3412 100%);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tabs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-cell);
            padding: 4px;
            border-radius: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 9px 0;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--btn-blue);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-cell);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .select-field, .input-field {
            background: var(--bg-cell);
            border: 1px solid var(--border-cell);
            color: #ffffff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            width: 100%;
            -webkit-user-select: text;
            user-select: text;
        }

        .select-field:focus, .input-field:focus {
            border-color: #60a5fa;
        }

        .compound-row {
            display: grid;
            grid-template-columns: 85px 1fr;
            gap: 8px;
        }

        .save-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid #34d399;
            color: #ffffff;
            padding: 14px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .save-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .toast-notify {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #38bdf8;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 18px rgba(0,0,0,0.7);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            text-align: center;
            max-width: 90%;
        }

        .toast-notify.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="viewport-container">
        <header class="header-box">
            <span class="header-title">VINCULAR CUENTA DE PAGO</span>
            <span style="font-size: 16px;">🔐</span>
        </header>

        <div class="tabs-row">
            <button class="tab-btn active" id="tabPM" onclick="cambiarModo('pm')">📱 PAGO MÓVIL</button>
            <button class="tab-btn" id="tabBinance" onclick="cambiarModo('binance')">🟨 BINANCE PAY</button>
        </div>

        <!-- FORMULARIO PAGO MÓVIL -->
        <div class="form-card" id="formPM">
            <div class="form-group">
                <label class="field-label">Banco Receptor / Destino</label>
                <select class="select-field" id="selBanco">
                    <option value="0102 - Banco de Venezuela -BDV-">0102 - Banco de Venezuela -BDV-</option>
                    <option value="0104 - Venezolano de Crédito">0104 - Venezolano de Crédito</option>
                    <option value="0105 - Banco Mercantil">0105 - Banco Mercantil</option>
                    <option value="0108 - Banco Provincial">0108 - Banco Provincial</option>
                    <option value="0114 - Bancaribe">0114 - Bancaribe</option>
                    <option value="0115 - Banco Exterior">0115 - Banco Exterior</option>
                    <option value="0128 - Banco Caroní">0128 - Banco Caroní</option>
                    <option value="0134 - Banesco">0134 - Banesco</option>
                    <option value="0137 - Banco Sofitasa">0137 - Banco Sofitasa</option>
                    <option value="0138 - Banco Plaza">0138 - Banco Plaza</option>
                    <option value="0151 - BFC Banco Fondo Común">0151 - BFC Banco Fondo Común</option>
                    <option value="0156 - 100% Banco">0156 - 100% Banco</option>
                    <option value="0157 - Banco DelSur">0157 - Banco DelSur</option>
                    <option value="0163 - Banco del Tesoro -BDT-">0163 - Banco del Tesoro -BDT-</option>
                    <option value="0166 - Banco Agrícola de Venezuela">0166 - Banco Agrícola</option>
                    <option value="0168 - Bancrecer">0168 - Bancrecer</option>
                    <option value="0169 - Mi Banco -R4 Banco-">0169 - Mi Banco</option>
                    <option value="0171 - Banco Activo">0171 - Banco Activo</option>
                    <option value="0172 - Bancamiga">0172 - Bancamiga</option>
                    <option value="0173 - Banco Internacional de Desarrollo">0173 - BID</option>
                    <option value="0174 - Banplus">0174 - Banplus</option>
                    <option value="0175 - Banco Bicentenario">0175 - Banco Bicentenario</option>
                    <option value="0177 - BANFANB">0177 - BANFANB</option>
                    <option value="0191 - BNC Nacional de Crédito -BNC-">0191 - BNC</option>
                </select>
            </div>

            <div class="form-group">
                <label class="field-label">Teléfono Afiliado</label>
                <div class="compound-row">
                    <select class="select-field" id="selPrefijo">
                        <option value="0414">0414</option>
                        <option value="0424">0424</option>
                        <option value="0412">0412</option>
                        <option value="0416">0416</option>
                        <option value="0426">0426</option>
                        <option value="0422">0422</option>
                    </select>
                    <input type="tel" class="input-field" id="inpTelefono" placeholder="1234567" maxlength="7">
                </div>
            </div>

            <div class="form-group">
                <label class="field-label">Documento de Identidad</label>
                <div class="compound-row">
                    <select class="select-field" id="selTipoDoc">
                        <option value="V">V</option>
                        <option value="E">E</option>
                        <option value="J">J</option>
                        <option value="G">G</option>
                        <option value="P">P</option>
                    </select>
                    <input type="tel" class="input-field" id="inpCedula" placeholder="12345678" maxlength="9">
                </div>
            </div>
        </div>

        <!-- FORMULARIO BINANCE PAY -->
        <div class="form-card" id="formBinance" style="display: none;">
            <div class="form-group">
                <label class="field-label">Binance Pay ID / Correo Afiliado</label>
                <input type="text" class="input-field" id="inpBinanceID" placeholder="Ej: 12345678 o usuario@correo.com">
            </div>
            <p style="font-size: 11px; color: var(--text-muted); line-height: 1.4;">
                💡 Los activos liquidados por este método se acreditarán exclusivamente en <strong>USDT</strong> sin comisiones de red adicionales.
            </p>
        </div>

        <button class="save-btn" id="btnGuardar" onclick="guardarCuenta()">
            <span>💾</span> REGISTRAR MÉTODO DE PAGO
        </button>
    </div>

    <div class="toast-notify" id="toastNotify"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.enableClosingConfirmation();
            tg.onEvent('viewportChanged', (e) => {
                if (e.isStateStable) document.body.style.height = 'var(--tg-viewport-stable-height, 100dvh)';
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const BACKEND_URL = urlParams.get('api') || "";
        let modoActual = 'pm';

        function cambiarModo(modo) {
            modoActual = modo;
            hapticFeedback('selection');
            if (modo === 'pm') {
                document.getElementById('tabPM').classList.add('active');
                document.getElementById('tabBinance').classList.remove('active');
                document.getElementById('formPM').style.display = 'flex';
                document.getElementById('formBinance').style.display = 'none';
            } else {
                document.getElementById('tabBinance').classList.add('active');
                document.getElementById('tabPM').classList.remove('active');
                document.getElementById('formPM').style.display = 'none';
                document.getElementById('formBinance').style.display = 'flex';
            }
        }

        async function guardarCuenta() {
            const btn = document.getElementById('btnGuardar');
            let payload = {};

            if (modoActual === 'pm') {
                const banco = document.getElementById('selBanco').value;
                const pref = document.getElementById('selPrefijo').value;
                const numTel = document.getElementById('inpTelefono').value.trim();
                const tipoDoc = document.getElementById('selTipoDoc').value;
                const numDoc = document.getElementById('inpCedula').value.trim();

                if (!numTel || numTel.length < 7 || !/^\d+$/.test(numTel)) {
                    hapticFeedback('error');
                    mostrarToast("❌ Ingresa un número telefónico válido (7 dígitos)");
                    return;
                }

                if (!numDoc || numDoc.length < 6 || !/^\d+$/.test(numDoc)) {
                    hapticFeedback('error');
                    mostrarToast("❌ Ingresa un número de documento válido");
                    return;
                }

                payload = {
                    banco: banco,
                    telefono: `${pref}${numTel}`,
                    cedula: `${tipoDoc}-${numDoc}`
                };
            } else {
                const binanceID = document.getElementById('inpBinanceID').value.trim();
                if (!binanceID || binanceID.length < 4) {
                    hapticFeedback('error');
                    mostrarToast("❌ Ingresa un Pay ID o correo válido");
                    return;
                }

                payload = {
                    banco: "Binance Pay",
                    telefono: binanceID,
                    cedula: ""
                };
            }

            btn.disabled = true;
            btn.style.pointerEvents = 'none';
            btn.innerText = "⏳ GUARDANDO...";
            hapticFeedback('impact');

            try {
                const endpoint = `${BACKEND_URL}/api/guardar-cuenta`;
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': tg?.initData || ''
                    },
                    body: JSON.stringify(payload)
                });

                const resData = await resp.json();
                if (resData.ok) {
                    hapticFeedback('success');
                    mostrarToast("✅ Cuenta registrada exitosamente. Regresando al bot...");
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 1200);
                } else {
                    hapticFeedback('error');
                    mostrarToast(`⚠️ ${resData.error || 'Error al guardar la cuenta'}`);
                    btn.disabled = false;
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = "<span>💾</span> REGISTRAR MÉTODO DE PAGO";
                }
            } catch (err) {
                console.error("Error al registrar cuenta:", err);
                hapticFeedback('error');
                mostrarToast("⚠️ Error de conexión con el servidor");
                btn.disabled = false;
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = "<span>💾</span> REGISTRAR MÉTODO DE PAGO";
            }
        }

        function hapticFeedback(tipo) {
            if (!tg?.HapticFeedback) return;
            if (tipo === 'impact') tg.HapticFeedback.impactOccurred('medium');
            else if (tipo === 'selection') tg.HapticFeedback.selectionChanged();
            else if (tipo === 'success') tg.HapticFeedback.notificationOccurred('success');
            else if (tipo === 'error') tg.HapticFeedback.notificationOccurred('error');
        }

        function mostrarToast(msj) {
            const t = document.getElementById('toastNotify');
            t.innerText = msj;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 2800);
        }
    </script>
</body>
</html>
